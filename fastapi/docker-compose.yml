# 백엔드 배포 스택. nextjs/flutter 는 Vercel 로 배포하므로 nginx/certbot 도
# api.ragtaylor.com / auth.ragtailor.com 만 담당한다 — 이 파일이 fastapi/ 에 있는 이유다.
#
# 실행 (프로젝트 디렉터리가 이 파일 위치이므로 fastapi/.env 가 자동 로드된다):
#   cd fastapi && docker compose up -d
#   docker compose -f fastapi/docker-compose.yml up -d      # 루트에서 실행해도 동일
#
# nginx/certbot 의 설정·인증서 디렉터리는 저장소 루트에 그대로 두고 ../ 로 참조한다.
services:
  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    # Nginx가 6시간마다 설정을 불러오게 처리 (인증서 갱신 반영용)
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  # Let's Encrypt 인증서 자동 갱신
  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: always
    volumes:
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    # 12시간마다 자동 갱신 시도
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # n8n 워크플로우 자동화
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # PostgreSQL + pgvector — 로컬 개발 전용 (profiles: local-db)
  # 운영에서는 dreamscape의 공유 DB를 쓰므로 기본 `docker compose up -d`로는 기동되지 않는다.
  # 로컬에서만: docker compose --profile local-db up -d pgvector
  # 호스트 5432를 점유하므로 다른 PostgreSQL(inception 등)이 떠 있으면 먼저 내린다.
  pgvector:
    image: pgvector/pgvector:pg17
    profiles:
      - local-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      # 최초 초기화 시 1회만 실행 — vector 익스텐션 생성
      - ./docker/pgvector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # FastAPI 백엔드 서비스 (운영 DB/Redis는 dreamscape의 limbo/totem 사용)
  # 로컬 pgvector는 위 local-db 프로파일로 분리돼 있어 이 서비스의 depends_on에 넣지 않는다.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    
      - "8081:8000"
    env_file:
      # ./.env: 기존 백엔드 설정(DATABASE_URL/REDIS_URL 등) 유지
      # ./.env.backend: JWT_PUBLIC_KEY(검증 전용). 개인키는 절대 넣지 않는다.
      - ./.env
      - ./.env.backend
    volumes:
      - .:/fastapi
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - default
      - dreamscape

  # 인증 게이트웨이 (auth.ragtailor.com) — 토큰 발급 전용. 개인키는 여기에만.
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn auth_main:app --host 0.0.0.0 --port 9000
    restart: unless-stopped
    env_file:
      - ./.env.auth   # JWT_PRIVATE_KEY, OAuth client secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dreamscape

  # Graph DB
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  dreamscape:
    external: true

volumes:
  n8n_data:
  neo4j_data:
  pgvector_data:
